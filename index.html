<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Primary Meta Tags -->
    <title>Razak Collections | Contemporary Photography Gallery</title>
    <meta
      name="description"
      content="Razak Collections is a contemporary photography gallery and limited-edition fine-art print shop based in Lagos, Nigeria. Browse and buy original photographic prints."
    />
    <meta name="author" content="Razak Collections" />
    <meta
      name="keywords"
      content="Razak Collections, photography gallery, Lagos, Nigeria, fine art prints, limited edition prints, contemporary photography"
    />
    <meta name="theme-color" content="#0f1c26" />
    <link rel="canonical" href="https://arty-space.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Razak Collections" />
    <meta property="og:url" content="https://arty-space.vercel.app/" />
    <meta
      property="og:title"
      content="Razak Collections | Contemporary Photography Gallery"
    />
    <meta
      property="og:description"
      content="A contemporary photography gallery and limited-edition fine-art print shop based in Lagos, Nigeria. Explore and collect original photographic prints."
    />
    <meta
      property="og:image"
      content="https://arty-space.vercel.app/og-image.jpg"
    />
    <meta property="og:image:alt" content="Featured photograph from Razak Collections" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@razakcollections" />
    <meta
      name="twitter:title"
      content="Razak Collections | Contemporary Photography Gallery"
    />
    <meta
      name="twitter:description"
      content="A contemporary photography gallery and limited-edition fine-art print shop based in Lagos, Nigeria."
    />
    <meta
      name="twitter:image"
      content="https://arty-space.vercel.app/og-image.jpg"
    />
    <meta name="twitter:image:alt" content="Featured photograph from Razak Collections" />

    <!-- Structured Data: Featured Artwork (Product) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Golden Horizon",
        "image": ["https://arty-space.vercel.app/og-image.jpg"],
        "description": "Warm golden sunset over calm waters. A limited-edition fine-art photographic print by Razak Collections.",
        "sku": "RC-001",
        "category": "Fine Art Photography Print",
        "brand": {
          "@type": "Brand",
          "name": "Razak Collections"
        },
        "creator": {
          "@type": "Person",
          "name": "Razak"
        },
        "offers": {
          "@type": "Offer",
          "url": "https://arty-space.vercel.app/shop",
          "priceCurrency": "NGN",
          "price": "120000",
          "availability": "https://schema.org/InStock",
          "itemCondition": "https://schema.org/NewCondition"
        }
      }
    </script>

    <!-- Structured Data: LocalBusiness (Gallery) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://arty-space.vercel.app/#business",
        "name": "Razak Collections",
        "description": "Contemporary photography gallery and limited-edition fine-art print shop in Lagos, Nigeria.",
        "url": "https://arty-space.vercel.app/",
        "image": "https://arty-space.vercel.app/og-image.jpg",
        "priceRange": "₦₦",
        "email": "thoemke@example.com",
        "telephone": "+3145683245",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lagos",
          "addressRegion": "Lagos",
          "addressCountry": "NG"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 6.5244,
          "longitude": 3.3792
        },
        "sameAs": [
          "https://twitter.com/yourhandle",
          "https://facebook.com/yourhandle",
          "https://youtube.com/@yourchannel"
        ]
      }
    </script>
  </head>
